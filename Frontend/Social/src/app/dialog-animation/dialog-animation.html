<div class="dialog">
  <h2 mat-dialog-title>Delete post</h2>
  <mat-dialog-content> Are you sure? </mat-dialog-content>
  <mat-dialog-actions>
    <button id="no-button" matButton [mat-dialog-close]="false">No</button>
    <button id="yes-button" matButton [mat-dialog-close]="true" cdkFocusInitial>Yes</button>
  </mat-dialog-actions>
</div>
