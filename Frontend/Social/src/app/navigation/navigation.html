<div class="nav">
  <div class="buttons">
    <button matButton [routerLink]="['/feed']">Feed</button>
    <button matButton [routerLink]="['/login']" *ngIf="!this.auth.isLoggedIn()">Login</button>
    <button matButton (click)="logout()" *ngIf="this.auth.isLoggedIn()">Logout</button>
  </div>
  <div class="user-logged-in" *ngIf="this.auth.isLoggedIn()">
    <h3 style="color: white">@{{ this.auth.activeUser() }}</h3>
  </div>
</div>
