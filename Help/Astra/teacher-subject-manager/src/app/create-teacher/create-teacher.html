<h1>Create Teacher</h1>

<mat-progress-spinner mode="indeterminate" *ngIf="this.isLoading()"></mat-progress-spinner>

<div class="my-container" *ngIf="!this.isLoading()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="this.teacher.name" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Name of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Neptun code</mat-label>
    <input matInput [(ngModel)]="this.teacher.neptun" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Neptun code of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Image URL</mat-label>
    <input matInput [(ngModel)]="this.teacher.image" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Image link of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Birth year</mat-label>
    <input matInput [(ngModel)]="this.teacher.birthYear" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Birth year of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Creator name</mat-label>
    <input matInput [(ngModel)]="this.teacher.creatorName" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Name of the creator</mat-hint>
  </mat-form-field>

  <div class="buttons">
    <button mat-flat-button color="accent" class="create-button" (click)="createTeacher()">
      Create
    </button>
    <button class="go-back-btn" mat-flat-button color="accent" (click)="goBack()">Go back</button>
  </div>
</div>
