<div class="header">
  <div class="first">
    <h1>Teachers</h1>
    <div class="actions">
      <button
        class="create-button"
        mat-flat-button
        color="accent"
        [routerLink]="['/create-teacher']"
      >
        Create new
      </button>
      <button class="connect-button" mat-flat-button color="accent" [routerLink]="['/connect']">
        Connect
      </button>
    </div>
  </div>
  <div class="second">
    <mat-form-field appearance="outline">
      <mat-label>Search...</mat-label>
      <input matInput [formControl]="search" />
      <mat-hint>Name or neptun code</mat-hint>
    </mat-form-field>
    <button class="clear" (click)="clearSearch()">
      <mat-icon aria-hidden="false" aria-label="Manage icon" fontIcon="clear"> </mat-icon>
    </button>
  </div>
</div>

<h3 *ngIf="this.isSearchEmpty()">Nothing found...</h3>

<mat-progress-spinner mode="indeterminate" *ngIf="this.isLoading()"></mat-progress-spinner>

<div class="my-container" *ngIf="!this.isLoading()">
  <mat-card class="example-card" *ngFor="let teacher of filteredTeachers()">
    <mat-card-header class="teacher-header">
      <div class="teacher-info">
        <mat-card-title>{{ teacher.name }}</mat-card-title>
        <mat-card-subtitle>{{ teacher.neptun }}</mat-card-subtitle>
      </div>
      <img mat-card-sm-image [src]="teacher.image" />
    </mat-card-header>
    <mat-card-content>
      <mat-divider></mat-divider>
      Teached subjects
      <div
        class="subjects-div"
        *ngIf="teacher.teachedSubjects.length > 0; else noElementsToDisplay"
      >
        <button
          class="btn"
          [routerLink]="['/list-subjects']"
          [queryParams]="{ search: subject.name }"
          mat-stroked-button
          *ngFor="let subject of teacher.teachedSubjects"
        >
          {{ subject.name }}
        </button>
      </div>
      <ng-template #noElementsToDisplay> There aren't any teached subjects. </ng-template>
      <mat-divider></mat-divider>
      <p class="teacher-id">{{ teacher.id }}</p>
      <mat-divider></mat-divider>
      <button class="edit-btn" mat-stroked-button [routerLink]="['/update-teachers/', teacher.id]">
        <mat-icon aria-label="Edit icon" aria-hidden="false" fontIcon="edit"></mat-icon>
        <span>Edit</span>
      </button>
    </mat-card-content>
  </mat-card>
</div>
