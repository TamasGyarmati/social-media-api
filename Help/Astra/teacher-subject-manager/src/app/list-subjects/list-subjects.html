<div class="header">
  <div class="first">
    <h1>Subjects</h1>
    <div class="actions">
      <button
        class="create-button"
        mat-flat-button
        color="accent"
        [routerLink]="['/create-subject']"
      >
        Create new
      </button>
      <button class="connect-button" mat-flat-button color="accent" [routerLink]="['/connect']">
        Connect
      </button>
    </div>
  </div>
  <div class="second">
    <mat-form-field appearance="outline">
      <mat-label>Search...</mat-label>
      <input matInput [formControl]="search" />
      <mat-hint>Name or neptun code</mat-hint>
    </mat-form-field>
    <button class="clear" (click)="clearSearch()">
      <mat-icon aria-hidden="false" aria-label="Manage icon" fontIcon="clear"> </mat-icon>
    </button>
  </div>
</div>

<h3 *ngIf="this.isSearchEmpty()">Nothing found...</h3>

<mat-progress-spinner *ngIf="this.isLoading()" mode="indeterminate"> </mat-progress-spinner>

<div class="my-container" *ngIf="!this.isLoading()">
  <mat-card class="example-card" *ngFor="let subject of filteredSubjects()">
    <mat-card-header class="subject-header">
      <div class="subject-info">
        <mat-card-title>{{ subject.name }}</mat-card-title>
        <mat-card-subtitle>{{ subject.neptun }}</mat-card-subtitle>
      </div>
      <img mat-card-sm-image [src]="subject.image" />
    </mat-card-header>
    <mat-card-content>
      <p>
        Exam:
        <mat-icon
          class="exam-icon"
          [class.green]="subject.exam"
          [class.red]="!subject.exam"
          [fontIcon]="subject.exam ? 'check' : 'cancel'"
        ></mat-icon>
      </p>
      <p>
        Credit: <span>{{ subject.credit }}</span>
      </p>
      <p>
        Registered students: <span>{{ subject.registeredStudents }}</span>
      </p>
      <mat-divider></mat-divider>
      <div class="subject-id">{{ subject.id }}</div>
      <mat-divider></mat-divider>
      <button class="edit-btn" mat-stroked-button [routerLink]="['/update-subjects/', subject.id]">
        <mat-icon aria-label="Edit icon" aria-hidden="false" fontIcon="edit"></mat-icon>
        <span>Edit</span>
      </button>
    </mat-card-content>
  </mat-card>
</div>
