<div class="my-container">
  <div class="heading">
    <h1>Welcome to <i>Astra</i></h1>
    <h3>
      A modern platform built to simplify school user management with a fast and intuitive
      experience.
    </h3>
  </div>
  <mat-progress-spinner mode="indeterminate" *ngIf="this.isLoading()"></mat-progress-spinner>
  <div class="content" *ngIf="!this.isLoading()">
    <mat-card class="example-card" appearance="outlined" *ngFor="let model of this.models">
      <mat-card-header>
        <mat-card-title> {{ model.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ model.content }}</p>
      </mat-card-content>
      <mat-card-footer class="example-card-footer">
        <mat-chip-set aria-label="">
          <mat-chip *ngFor="let chip of model.chips"
            ><span>{{ chip }}</span></mat-chip
          >
        </mat-chip-set>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
